<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <header>
    <h1>YTFocus</h1>
    <p>YouTube, tanpa distraksi.</p>
  </header>

  <hr class="divider">

  <div class="setting-row">
    <div class="setting-info">
      <span class="setting-title">Blur komentar</span>
      <span class="setting-desc">Komentar YouTube dibuat blur</span>
    </div>
    <label class="toggle">
      <input type="checkbox" id="toggle-comments">
      <span class="slider"></span>
    </label>
  </div>

  <div class="setting-row">
    <div class="setting-info">
      <span class="setting-title">Blur rekomendasi</span>
      <span class="setting-desc">Konten rekomendasi dibuat blur</span>
    </div>
    <label class="toggle">
      <input type="checkbox" id="toggle-recs">
      <span class="slider"></span>
    </label>
  </div>

  <script src="popup.js"></script>
</body>

</html>
